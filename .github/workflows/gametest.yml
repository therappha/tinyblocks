name: GameTest

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/main/java/com/therappha/tinyblocks/v2/**'
      - 'src/main/java/com/therappha/tinyblocks/subgrid/**'
      - 'src/main/java/com/therappha/tinyblocks/gametest/**'

jobs:
  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run GameTest server
        run: ./gradlew runGameTestServer -Pmod_version=0.0.0

      - name: Upload GameTest crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-crash-reports
          path: run/crash-reports
          if-no-files-found: ignore
