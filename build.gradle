plugins {
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.modrinth.minotaur' version '2.+'
    id 'jacoco'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Unit tests touch real Minecraft/NeoForge registries (Blocks, FeatureFlags, ...), which throw
    // "Not bootstrapped" / NPE unless loaded through NeoForge's own FML bootstrap — plain JUnit on
    // the main classpath isn't enough. ModDevGradle's own unit-test integration runs the test task
    // inside that same bootstrap instead of a hand-rolled one, since it's what NeoForge's own game
    // libraries/module-path/args-file wiring expects.
    unitTest {
        testedMod = mods.named(mod_id)
        enable()
    }
}

repositories {
    mavenCentral()
    // EXPERIMENT (feat/flywheel-create-experiment): Create + Flywheel to test hosting their
    // block-entity visuals inside a subgrid. Dev-only; not part of the shipped dependency set.
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
}

dependencies {
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}", { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Not a blanket coverage target for the whole mod — most of this codebase only makes sense
// running against a real Minecraft world (see GameTest, not unit tests, for that). Scoped instead
// to classes that already have real unit coverage, as a regression guard: if someone deletes or
// weakens FakeCellGetterTest later, the build fails instead of silently losing that coverage.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['com.therappha.tinyblocks.v2.FakeCellGetter']
            limit {
                counter = 'LINE'
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "tinyblocks"
    versionNumber = version
    versionType = "release"
    uploadFile = jar
    gameVersions = ["1.21.1"]
    loaders = ["neoforge"]
    changelog = System.getenv("CHANGELOG") ?: ""
}
